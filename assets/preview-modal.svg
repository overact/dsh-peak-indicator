<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="100%" height="100%">
  <defs>
    <linearGradient id="modalBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Overlay -->
  <rect width="720" height="840" fill="url(#modalBgGrad)"/>

  <!-- Modal Card -->
  <g transform="translate(60, 30)" filter="url(#cardShadow)">
    <rect width="600" height="780" rx="14" fill="#1e2430" stroke="#334155" stroke-width="1"/>

    <!-- Modal Header -->
    <g transform="translate(0, 0)">
      <rect width="600" height="54" rx="14" fill="#1e2430"/>
      <line x1="0" y1="54" x2="600" y2="54" stroke="#334155" stroke-width="1"/>
      <!-- Green Dot -->
      <circle cx="28" cy="27" r="4.5" fill="#10b981"/>
      <circle cx="28" cy="27" r="6.5" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.45"/>
      <text x="42" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">DeepSeek V4 高峰/平峰时段与定价说明</text>
      <!-- Close button -->
      <circle cx="570" cy="27" r="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="570" y="32" fill="#94a3b8" font-family="sans-serif" font-size="16" text-anchor="middle">×</text>
    </g>

    <!-- Modal Body -->
    <g transform="translate(20, 70)">
      
      <!-- 1. Hero Status Card (Off-Peak) -->
      <g transform="translate(0, 0)">
        <rect width="560" height="76" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
        <!-- Left Title & Sub -->
        <circle cx="22" cy="24" r="4.5" fill="#10b981"/>
        <text x="34" y="28" fill="#10b981" font-family="-apple-system, sans-serif" font-size="14.5" font-weight="600">DeepSeek 官方平峰 · 5 折优惠</text>
        <text x="22" y="46" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">当前按平峰优惠价格计费，全量输入与输出均为高峰价的 50%</text>
        <text x="22" y="64" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">将于本地时间 09:00 切换为【高峰价】</text>
        <!-- Right Countdown Clock -->
        <g transform="translate(420, 16)">
          <text x="124" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="end" text-transform="uppercase" letter-spacing="0.5">距高峰还剩</text>
          <text x="124" y="44" fill="#10b981" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" font-weight="700" text-anchor="end">02:45:18</text>
        </g>
      </g>

      <!-- 2. Dual Clocks Grid -->
      <g transform="translate(0, 88)">
        <!-- Local Time -->
        <g transform="translate(0, 0)">
          <rect width="272" height="58" rx="8" fill="rgba(125, 125, 125, 0.06)" stroke="#334155" stroke-width="1"/>
          <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">🌐 本地时间 (UTC+8)</text>
          <text x="14" y="44" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="16" font-weight="600">06:14:42</text>
          <text x="258" y="44" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">Asia/Shanghai</text>
        </g>
        <!-- Beijing Time -->
        <g transform="translate(288, 0)">
          <rect width="272" height="58" rx="8" fill="rgba(125, 125, 125, 0.06)" stroke="#334155" stroke-width="1"/>
          <text x="14" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">🕒 北京时间 (UTC+8)</text>
          <text x="14" y="44" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="16" font-weight="600">06:14:42</text>
          <text x="258" y="44" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="end">DeepSeek 服务器时区</text>
        </g>
      </g>

      <!-- 3. 24-Hour Timeline Visualizer -->
      <g transform="translate(0, 158)">
        <rect width="560" height="120" rx="10" fill="rgba(125, 125, 125, 0.05)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">🕒 24 小时全景时段分布 (北京时间)</text>
        
        <!-- Track Background -->
        <g transform="translate(16, 42)">
          <!-- Segment 1: 00:00 - 09:00 (Off-Peak) -->
          <rect x="0" y="0" width="198" height="22" rx="4" fill="#10b981" opacity="0.85"/>
          <!-- Segment 2: 09:00 - 12:00 (Peak) -->
          <rect x="198" y="0" width="66" height="22" fill="#f59e0b" opacity="0.85"/>
          <!-- Segment 3: 12:00 - 14:00 (Off-Peak) -->
          <rect x="264" y="0" width="44" height="22" fill="#10b981" opacity="0.85"/>
          <!-- Segment 4: 14:00 - 18:00 (Peak) -->
          <rect x="308" y="0" width="88" height="22" fill="#f59e0b" opacity="0.85"/>
          <!-- Segment 5: 18:00 - 24:00 (Off-Peak) -->
          <rect x="396" y="0" width="132" height="22" rx="4" fill="#10b981" opacity="0.85"/>

          <!-- Real-Time Cursor Pin (e.g. 06:14 ~ 26%) -->
          <line x1="137" y1="0" x2="137" y2="22" stroke="#ffffff" stroke-width="3"/>
          <circle cx="137" cy="0" r="4.5" fill="#ffffff"/>
        </g>

        <!-- Timeline Tick Marks -->
        <g transform="translate(16, 78)">
          <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10.5">00:00</text>
          <text x="198" y="0" fill="#64748b" font-family="monospace" font-size="10.5" text-anchor="middle">09:00</text>
          <text x="264" y="0" fill="#64748b" font-family="monospace" font-size="10.5" text-anchor="middle">12:00</text>
          <text x="308" y="0" fill="#64748b" font-family="monospace" font-size="10.5" text-anchor="middle">14:00</text>
          <text x="396" y="0" fill="#64748b" font-family="monospace" font-size="10.5" text-anchor="middle">18:00</text>
          <text x="528" y="0" fill="#64748b" font-family="monospace" font-size="10.5" text-anchor="end">24:00</text>
        </g>

        <!-- Timeline Legend -->
        <g transform="translate(16, 98)">
          <circle cx="6" cy="6" r="4" fill="#10b981"/>
          <text x="16" y="10" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">平峰时段 (00:00~09:00, 12:00~14:00, 18:00~24:00) 享 5 折半价</text>
          <circle cx="340" cy="6" r="4" fill="#f59e0b"/>
          <text x="350" y="10" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">高峰时段 (09:00~12:00, 14:00~18:00) 官方标准价</text>
        </g>
      </g>

      <!-- 4. Official Pricing Table -->
      <g transform="translate(0, 290)">
        <rect width="560" height="200" rx="10" fill="rgba(125, 125, 125, 0.05)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">DeepSeek V4 官方 API 定价表</text>
        <text x="544" y="24" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11" text-anchor="end">单位：元 / 百万 tokens</text>
        
        <!-- Rules bullets -->
        <g transform="translate(16, 38)">
          <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11"><strong>计费规则于 2026-08-17 00:00 起生效：</strong></text>
          <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">• 高峰窗口 09:00~12:00 与 14:00~18:00；平峰时段全量 Token 5 折半价</text>
          <text x="0" y="32" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10.5">官方文档：https://api-docs.deepseek.com/zh-cn/quick_start/pricing</text>
        </g>

        <!-- Table Structure with Wrapped Headers -->
        <g transform="translate(16, 88)">
          <!-- Table Header -->
          <rect width="528" height="34" fill="rgba(255, 255, 255, 0.04)" rx="4"/>
          <text x="12" y="22" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">模型名称</text>
          <text x="140" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">基础输入 / 未命中</text>
          <text x="140" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9.5">(平峰 / 高峰)</text>
          <text x="280" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">缓存命中输入</text>
          <text x="280" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9.5">(平峰 / 高峰)</text>
          <text x="410" y="16" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">模型输出</text>
          <text x="410" y="28" fill="#64748b" font-family="-apple-system, sans-serif" font-size="9.5">(平峰 / 高峰)</text>
          <line x1="0" y1="34" x2="528" y2="34" stroke="#334155" stroke-width="1"/>

          <!-- Row 1: Flash -->
          <g transform="translate(0, 36)">
            <text x="12" y="22" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">DeepSeek-V4-Flash</text>
            <text x="140" y="22" fill="#10b981" font-family="monospace" font-size="11.5">¥1.50 <tspan fill="#94a3b8">/ ¥3.00</tspan></text>
            <text x="280" y="22" fill="#10b981" font-family="monospace" font-size="11.5">¥0.05 <tspan fill="#94a3b8">/ ¥0.10</tspan></text>
            <text x="410" y="22" fill="#10b981" font-family="monospace" font-size="11.5">¥4.50 <tspan fill="#94a3b8">/ ¥9.00</tspan></text>
            <line x1="0" y1="32" x2="528" y2="32" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
          </g>

          <!-- Row 2: Pro -->
          <g transform="translate(0, 70)">
            <text x="12" y="22" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">DeepSeek-V4-Pro</text>
            <text x="140" y="22" fill="#10b981" font-family="monospace" font-size="11.5">¥4.50 <tspan fill="#94a3b8">/ ¥9.00</tspan></text>
            <text x="280" y="22" fill="#10b981" font-family="monospace" font-size="11.5">¥0.15 <tspan fill="#94a3b8">/ ¥0.30</tspan></text>
            <text x="410" y="22" fill="#10b981" font-family="monospace" font-size="11.5">¥13.50 <tspan fill="#94a3b8">/ ¥27.00</tspan></text>
          </g>
        </g>
      </g>

      <!-- 5. Quick Settings Section -->
      <g transform="translate(0, 502)">
        <rect width="560" height="178" rx="10" fill="rgba(125, 125, 125, 0.05)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">⚙️ 显示与模式快捷设置 (Quick Settings)</text>
        <rect x="476" y="10" width="68" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="510" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10.5" text-anchor="middle">恢复默认</text>

        <!-- Dropdowns Grid -->
        <g transform="translate(16, 42)">
          <!-- Display Style Select -->
          <g transform="translate(0, 0)">
            <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">顶栏显示样式</text>
            <rect x="0" y="8" width="254" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
            <text x="10" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5">紧凑模式 (圆点 + 状态文本)</text>
          </g>
          <!-- Floating Pill Select -->
          <g transform="translate(274, 0)">
            <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">全局悬浮胶囊位置</text>
            <rect x="0" y="8" width="254" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
            <text x="10" y="26" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5">关闭悬浮 (仅顶栏与侧边栏)</text>
          </g>
        </g>

        <!-- Checkboxes Grid -->
        <g transform="translate(16, 102)">
          <!-- Checkbox 1 -->
          <rect x="0" y="0" width="14" height="14" rx="3" fill="#3b82f6"/>
          <path d="M3 7 L6 10 L11 4" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          <text x="22" y="11.5" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5">在会话顶栏显示</text>

          <!-- Checkbox 2 -->
          <rect x="274" y="0" width="14" height="14" rx="3" fill="#3b82f6"/>
          <path d="M277 7 L280 10 L285 4" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          <text x="296" y="11.5" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5">显示秒级倒计时</text>

          <!-- Checkbox 3 -->
          <rect x="0" y="32" width="14" height="14" rx="3" fill="#3b82f6"/>
          <path d="M3 39 L6 42 L11 36" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          <text x="22" y="43.5" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="11.5">显示双时区时钟</text>

          <!-- Checkbox 4 -->
          <rect x="274" y="32" width="14" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
          <text x="296" y="43.5" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11.5">时段切换桌面提醒</text>
        </g>
      </g>
    </g>
  </g>
</svg>
