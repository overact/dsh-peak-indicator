<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 920" width="100%" height="100%">
  <defs>
    <linearGradient id="modalBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1a2234"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <style>
      text {
        font-family: 'WenQuanYi Zen Hei', 'Droid Sans Fallback', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .mono {
        font-family: 'WenQuanYi Zen Hei Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </defs>

  <!-- Dark Background Overlay -->
  <rect width="740" height="920" fill="url(#modalBgGrad)"/>

  <!-- Modal Card Dialog -->
  <g transform="translate(50, 24)" filter="url(#cardShadow)">
    <rect width="640" height="870" rx="14" fill="#1e2430" stroke="#334155" stroke-width="1"/>

    <!-- Modal Header -->
    <g transform="translate(0, 0)">
      <rect width="640" height="54" rx="14" fill="#1e2430"/>
      <line x1="0" y1="54" x2="640" y2="54" stroke="#334155" stroke-width="1"/>
      <!-- Green Glowing Dot -->
      <circle cx="28" cy="27" r="4.5" fill="#10b981"/>
      <circle cx="28" cy="27" r="6.5" fill="none" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.45"/>
      <text x="44" y="32" fill="#f8fafc" font-size="15" font-weight="600">DeepSeek V4 高峰/平峰时段与定价说明</text>
      <!-- Close button -->
      <circle cx="610" cy="27" r="14" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="610" y="33" fill="#94a3b8" font-size="16" text-anchor="middle">×</text>
    </g>

    <!-- Modal Body -->
    <g transform="translate(20, 68)">
      
      <!-- 1. Hero Status Card (Off-Peak State) -->
      <g transform="translate(0, 0)">
        <rect width="600" height="78" rx="10" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1"/>
        <!-- Left Title & Sub -->
        <circle cx="22" cy="24" r="4.5" fill="#10b981"/>
        <text x="34" y="28" fill="#10b981" font-size="14.5" font-weight="600">DeepSeek 官方平峰 · 5 折优惠</text>
        <text x="22" y="47" fill="#94a3b8" font-size="11.5">当前按平峰优惠价格计费，全量输入与输出均为高峰价的 50%</text>
        <text x="22" y="66" fill="#f8fafc" font-size="11.5" font-weight="600">将于本地时间 09:00 切换为【高峰价】</text>
        <!-- Right Live Countdown Clock -->
        <g transform="translate(450, 16)">
          <text x="134" y="16" fill="#94a3b8" font-size="11" text-anchor="end" letter-spacing="0.5">距高峰还剩</text>
          <text x="134" y="45" fill="#10b981" class="mono" font-size="21" font-weight="700" text-anchor="end">02:45:18</text>
        </g>
      </g>

      <!-- 2. Dual Clocks Grid -->
      <g transform="translate(0, 90)">
        <!-- Local Time -->
        <g transform="translate(0, 0)">
          <rect width="292" height="58" rx="8" fill="rgba(125, 125, 125, 0.06)" stroke="#334155" stroke-width="1"/>
          <text x="14" y="22" fill="#94a3b8" font-size="11.5">🌐 本地时间 (UTC+8)</text>
          <text x="14" y="45" fill="#f8fafc" class="mono" font-size="16" font-weight="600">06:14:42</text>
          <text x="278" y="44" fill="#64748b" font-size="10.5" text-anchor="end">Asia/Shanghai</text>
        </g>
        <!-- Beijing Time -->
        <g transform="translate(308, 0)">
          <rect width="292" height="58" rx="8" fill="rgba(125, 125, 125, 0.06)" stroke="#334155" stroke-width="1"/>
          <text x="14" y="22" fill="#94a3b8" font-size="11.5">🕒 北京时间 (UTC+8)</text>
          <text x="14" y="45" fill="#f8fafc" class="mono" font-size="16" font-weight="600">06:14:42</text>
          <text x="278" y="44" fill="#64748b" font-size="10.5" text-anchor="end">DeepSeek 服务器时区</text>
        </g>
      </g>

      <!-- 3. 24-Hour Timeline Visualizer -->
      <g transform="translate(0, 160)">
        <rect width="600" height="124" rx="10" fill="rgba(125, 125, 125, 0.05)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-size="12" font-weight="600">🕒 24 小时全景时段分布 (北京时间)</text>
        
        <!-- Track Background -->
        <g transform="translate(16, 42)">
          <!-- Segment 1: 00:00 - 09:00 (Off-Peak) -->
          <rect x="0" y="0" width="213" height="22" rx="4" fill="#10b981" opacity="0.85"/>
          <!-- Segment 2: 09:00 - 12:00 (Peak) -->
          <rect x="213" y="0" width="71" height="22" fill="#f59e0b" opacity="0.85"/>
          <!-- Segment 3: 12:00 - 14:00 (Off-Peak) -->
          <rect x="284" y="0" width="47" height="22" fill="#10b981" opacity="0.85"/>
          <!-- Segment 4: 14:00 - 18:00 (Peak) -->
          <rect x="331" y="0" width="95" height="22" fill="#f59e0b" opacity="0.85"/>
          <!-- Segment 5: 18:00 - 24:00 (Off-Peak) -->
          <rect x="426" y="0" width="142" height="22" rx="4" fill="#10b981" opacity="0.85"/>

          <!-- Real-Time Cursor Pin (e.g. 06:14 ~ 26%) -->
          <line x1="147" y1="0" x2="147" y2="22" stroke="#ffffff" stroke-width="3"/>
          <circle cx="147" cy="0" r="4.5" fill="#ffffff"/>
        </g>

        <!-- Timeline Tick Marks -->
        <g transform="translate(16, 78)">
          <text x="0" y="0" fill="#64748b" class="mono" font-size="10.5">00:00</text>
          <text x="213" y="0" fill="#64748b" class="mono" font-size="10.5" text-anchor="middle">09:00</text>
          <text x="284" y="0" fill="#64748b" class="mono" font-size="10.5" text-anchor="middle">12:00</text>
          <text x="331" y="0" fill="#64748b" class="mono" font-size="10.5" text-anchor="middle">14:00</text>
          <text x="426" y="0" fill="#64748b" class="mono" font-size="10.5" text-anchor="middle">18:00</text>
          <text x="568" y="0" fill="#64748b" class="mono" font-size="10.5" text-anchor="end">24:00</text>
        </g>

        <!-- Timeline Legend -->
        <g transform="translate(16, 102)">
          <circle cx="6" cy="6" r="4" fill="#10b981"/>
          <text x="16" y="10" fill="#94a3b8" font-size="11">平峰时段 (00:00~09:00, 12:00~14:00, 18:00~24:00) 享 5 折半价</text>
          <circle cx="360" cy="6" r="4" fill="#f59e0b"/>
          <text x="370" y="10" fill="#94a3b8" font-size="11">高峰时段 (09:00~12:00, 14:00~18:00) 官方标准价</text>
        </g>
      </g>

      <!-- 4. Official Pricing Table & Detailed Rules -->
      <g transform="translate(0, 296)">
        <rect width="600" height="236" rx="10" fill="rgba(125, 125, 125, 0.05)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-size="12" font-weight="600">DeepSeek V4 官方 API 定价表</text>
        <text x="584" y="24" fill="#64748b" font-size="11" text-anchor="end">单位：元 / 百万 tokens</text>
        
        <!-- Rules bullets -->
        <g transform="translate(16, 42)">
          <text x="0" y="0" fill="#cbd5e1" font-size="11.5" font-weight="600">计费规则于 2026-08-17 00:00（北京时间）起生效：</text>
          <text x="0" y="18" fill="#94a3b8" font-size="11">• 高峰时段：每日 09:00~12:00 与 14:00~18:00（北京时间）。</text>
          <text x="0" y="34" fill="#94a3b8" font-size="11">• 平峰时段：其余 17 个小时，缓存命中、未命中输入与模型输出全部 5 折。</text>
          <text x="0" y="50" fill="#94a3b8" font-size="11">• 适用模型：DeepSeek-V4-Flash-0731 与 DeepSeek-V4-Pro-0813。</text>
          <text x="0" y="66" fill="#60a5fa" font-size="10.5" text-decoration="underline">官方文档：https://api-docs.deepseek.com/zh-cn/quick_start/pricing</text>
        </g>

        <!-- Table Structure with Wrapped Headers -->
        <g transform="translate(16, 122)">
          <!-- Table Header Background -->
          <rect width="568" height="38" fill="rgba(255, 255, 255, 0.04)" rx="4"/>
          <text x="12" y="24" fill="#94a3b8" font-size="11.5" font-weight="600">模型名称</text>
          
          <text x="150" y="16" fill="#94a3b8" font-size="11" font-weight="600">基础输入 / 未命中</text>
          <text x="150" y="30" fill="#64748b" font-size="10">(平峰 / 高峰)</text>
          
          <text x="300" y="16" fill="#94a3b8" font-size="11" font-weight="600">缓存命中输入</text>
          <text x="300" y="30" fill="#64748b" font-size="10">(平峰 / 高峰)</text>
          
          <text x="440" y="16" fill="#94a3b8" font-size="11" font-weight="600">模型输出</text>
          <text x="440" y="30" fill="#64748b" font-size="10">(平峰 / 高峰)</text>
          <line x1="0" y1="38" x2="568" y2="38" stroke="#334155" stroke-width="1"/>

          <!-- Row 1: Flash -->
          <g transform="translate(0, 42)">
            <text x="12" y="20" fill="#f8fafc" font-size="11.5" font-weight="600">DeepSeek-V4-Flash</text>
            <text x="150" y="20" fill="#10b981" class="mono" font-size="12" font-weight="600">¥1.50 <tspan fill="#94a3b8" font-weight="normal">/ ¥3.00</tspan></text>
            <text x="300" y="20" fill="#10b981" class="mono" font-size="12" font-weight="600">¥0.05 <tspan fill="#94a3b8" font-weight="normal">/ ¥0.10</tspan></text>
            <text x="440" y="20" fill="#10b981" class="mono" font-size="12" font-weight="600">¥4.50 <tspan fill="#94a3b8" font-weight="normal">/ ¥9.00</tspan></text>
            <line x1="0" y1="30" x2="568" y2="30" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
          </g>

          <!-- Row 2: Pro -->
          <g transform="translate(0, 76)">
            <text x="12" y="20" fill="#f8fafc" font-size="11.5" font-weight="600">DeepSeek-V4-Pro</text>
            <text x="150" y="20" fill="#10b981" class="mono" font-size="12" font-weight="600">¥4.50 <tspan fill="#94a3b8" font-weight="normal">/ ¥9.00</tspan></text>
            <text x="300" y="20" fill="#10b981" class="mono" font-size="12" font-weight="600">¥0.15 <tspan fill="#94a3b8" font-weight="normal">/ ¥0.30</tspan></text>
            <text x="440" y="20" fill="#10b981" class="mono" font-size="12" font-weight="600">¥13.50 <tspan fill="#94a3b8" font-weight="normal">/ ¥27.00</tspan></text>
          </g>
        </g>
      </g>

      <!-- 5. Quick Settings Section -->
      <g transform="translate(0, 544)">
        <rect width="600" height="240" rx="10" fill="rgba(125, 125, 125, 0.05)" stroke="#334155" stroke-width="1"/>
        <text x="16" y="24" fill="#f8fafc" font-size="12" font-weight="600">⚙️ 显示与模式快捷设置 (Quick Settings)</text>
        <rect x="516" y="10" width="68" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
        <text x="550" y="25" fill="#94a3b8" font-size="10.5" text-anchor="middle">恢复默认</text>

        <!-- Dropdowns Grid (Row 1) -->
        <g transform="translate(16, 42)">
          <!-- Display Style Select -->
          <g transform="translate(0, 0)">
            <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="600">顶栏显示样式</text>
            <rect x="0" y="8" width="270" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
            <text x="10" y="26" fill="#f8fafc" font-size="11.5">紧凑模式 (圆点 + 状态文本)</text>
          </g>
          <!-- Floating Pill Select -->
          <g transform="translate(298, 0)">
            <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="600">全局悬浮胶囊位置</text>
            <rect x="0" y="8" width="270" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
            <text x="10" y="26" fill="#f8fafc" font-size="11.5">关闭悬浮 (仅顶栏与侧边栏)</text>
          </g>
        </g>

        <!-- Schedule Rule Mode (Row 2) -->
        <g transform="translate(16, 92)">
          <text x="0" y="0" fill="#94a3b8" font-size="11" font-weight="600">时段判定规则</text>
          <rect x="0" y="8" width="568" height="28" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
          <text x="10" y="26" fill="#f8fafc" font-size="11.5">DeepSeek V4 官方时段（高峰 09~12 / 14~18，其余平峰 5 折）</text>
        </g>

        <!-- Checkboxes Grid (Row 3) -->
        <g transform="translate(16, 148)">
          <!-- Checkbox 1 -->
          <rect x="0" y="0" width="14" height="14" rx="3" fill="#3b82f6"/>
          <path d="M3 7 L6 10 L11 4" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          <text x="22" y="11.5" fill="#f8fafc" font-size="11.5">在会话顶栏显示</text>

          <!-- Checkbox 2 -->
          <rect x="298" y="0" width="14" height="14" rx="3" fill="#3b82f6"/>
          <path d="M301 7 L304 10 L309 4" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          <text x="320" y="11.5" fill="#f8fafc" font-size="11.5">显示秒级倒计时</text>

          <!-- Checkbox 3 -->
          <rect x="0" y="32" width="14" height="14" rx="3" fill="#3b82f6"/>
          <path d="M3 39 L6 42 L11 36" stroke="#ffffff" stroke-width="1.8" fill="none"/>
          <text x="22" y="43.5" fill="#f8fafc" font-size="11.5">显示双时区时钟</text>

          <!-- Checkbox 4 -->
          <rect x="298" y="32" width="14" height="14" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
          <text x="320" y="43.5" fill="#94a3b8" font-size="11.5">时段切换桌面提醒</text>
          <rect x="444" y="28" width="124" height="22" rx="4" fill="rgba(59, 130, 246, 0.12)" stroke="#3b82f6" stroke-width="1"/>
          <text x="506" y="43" fill="#60a5fa" font-size="10.5" text-anchor="middle">测试通知 / 申请权限</text>
        </g>
      </g>
    </g>
  </g>
</svg>
